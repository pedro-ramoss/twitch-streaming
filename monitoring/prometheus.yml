global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: twitch-metrics
    static_configs:
      - targets:
          - metrics-exporter:8000

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
