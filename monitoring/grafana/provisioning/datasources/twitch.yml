apiVersion: 1

datasources:
  - name: Twitch Prometheus
    uid: twitch-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  - name: Twitch PostgreSQL
    uid: twitch-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: twitch
    isDefault: false
    editable: false
    jsonData:
      database: twitch_data
      sslmode: disable  # Rede Docker local; para cloud exigir TLS.
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
    secureJsonData:
      # O segredo entra no container via .env, não fica no Git.
      password: $POSTGRES_PASSWORD
